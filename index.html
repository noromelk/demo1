<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Օնլայն գրանցում — Zara Nail</title>
<style>
:root{--bg:#000;--card:#101010;--card2:#171717;--tx:#f3ece8;--mut:#9b918c;--ac:#e8c4b8;--ac-d:#c99a8a;--bd:#2a2523;--on-ac:#1a0f0c}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font-family:system-ui,"Noto Sans Armenian",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 48px}
.brand{text-align:center;padding:18px 0 26px}
.brand h1{margin:0;font-family:Georgia,"Noto Serif Armenian",serif;font-weight:400;font-size:34px;letter-spacing:.04em;color:var(--ac)}
.brand p{margin:6px 0 0;color:var(--mut);font-size:15px}
.brand::after{content:"";display:block;width:56px;height:1px;background:var(--ac-d);margin:20px auto 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px 22px;margin-bottom:20px}
h2{margin:0 0 18px;font-family:Georgia,"Noto Serif Armenian",serif;font-weight:400;font-size:24px;color:var(--tx)}
/* services */
.master{margin-bottom:26px}
.master:last-child{margin-bottom:0}
.master>b{display:block;font-family:Georgia,"Noto Serif Armenian",serif;font-weight:400;font-size:19px;color:var(--ac);padding-bottom:8px;border-bottom:1px solid var(--ac-d);margin-bottom:4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item .nm{font-size:16px}
.item .pr{display:block;color:var(--ac);font-size:15px;margin-top:2px}
button{font:inherit;font-size:15px;cursor:pointer;border-radius:999px;padding:11px 22px;border:1px solid transparent;transition:background .2s,color .2s}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.ghost{background:transparent;color:var(--ac);border-color:var(--ac-d);padding:8px 18px;white-space:nowrap}
button.ghost:hover{background:var(--ac);color:var(--on-ac)}
.primary{background:var(--ac);color:var(--on-ac);font-weight:600;width:100%;margin-top:6px}
.primary:hover{background:#f2d3c8}
.primary:disabled{opacity:.5;cursor:not-allowed}
/* booking form */
label{display:block;font-size:14px;color:var(--mut)}
input,select{width:100%;padding:12px 14px;margin:6px 0 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card2);color:var(--tx);font:inherit;font-size:16px}
input:focus,select:focus{border-color:var(--ac-d)}
form{text-align:left}
.err{color:#ff8a80;font-size:14px;min-height:20px;margin-bottom:6px}
.ok{color:var(--ac);font-size:17px;text-align:center;padding:12px 0}
.empty{color:var(--mut);text-align:center;padding:10px 0}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Zara Nail</h1>
    <p>Գրանցվեք մեզ մոտ առցանց</p>
  </div>

  <div class="card">
    <h2>Մեր ծառայությունները</h2>
    <div id="all"><div class="empty">Բեռնվում է…</div></div>
  </div>

  <div class="card" id="book">
    <h2>Նոր գրանցում</h2>
    <div id="msg" class="empty">Բեռնվում է…</div>
    <form id="bForm" class="hide">
      <label for="master">Աշխատակից</label><select id="master"></select>
      <label for="serv">Ծառայություն</label><select id="serv" required></select>
      <label for="slot">Ազատ ժամ</label><select id="slot" required></select>
      <label for="name">Ձեր անունը</label><input id="name" required maxlength="80">
      <label for="phone">Հեռախոս</label><input id="phone" type="tel" required maxlength="30">
      <div class="err" id="err"></div>
      <button class="primary" id="btn">Գրանցվել</button>
    </form>
    <div id="done" class="ok hide">✅ Դուք գրանցվեցիք։ Աշխատակիցը շուտով կհաստատի ձեր գրանցումը։</div>
  </div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDocs, collection, query, where, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";


const firebaseConfig = {
  apiKey: "AIzaSyAb21A8xIv1n99biiKX_dLj43QBR6rddHg",
  authDomain: "zara-nail.firebaseapp.com",
  projectId: "zara-nail",
  storageBucket: "zara-nail.firebasestorage.app",
  messagingSenderId: "344377626013",
  appId: "1:344377626013:web:63039a78264e54f89ab374",
  measurementId: "G-B381Y523GP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
isSupported().then(ok => { if (ok) getAnalytics(app); }).catch(() => {});

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d.split('-').reverse().join('.');


let masters = [], slots = [];
const pre = new URLSearchParams(location.search).get("m");
const money = n => Number(n).toLocaleString() + " ֏";
const todayStr = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

async function init() {
  try {
    const us = await getDocs(collection(db, "users"));
    masters = await Promise.all(us.docs.map(async d => {
      const s = await getDocs(collection(db, "users", d.id, "services"));
      return { id: d.id, name: d.data().displayName || d.data().username || "Աշխատակից",
               services: s.docs.map(x => ({ id: x.id, ...x.data() })) };
    }));
    masters = masters.filter(m => m.services.length);
    if (!masters.length) { $("all").innerHTML = '<div class="empty">Ծառայություններ դեռ չկան։</div>'; return $("msg").textContent = "Ծառայություններ դեռ չկան։"; }
    $("master").innerHTML = masters.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
    if (pre && masters.some(m => m.id === pre)) $("master").value = pre;
    $("all").innerHTML = masters.map(m => `<div class="master"><b>${esc(m.name)}</b>` +
      m.services.map(s => `<div class="item"><div class="nm">${esc(s.name)}<span class="pr">${money(s.price)}</span></div>
        <button class="ghost" type="button" onclick="pick('${m.id}','${s.id}')">Ընտրել</button></div>`).join("") + `</div>`).join("");
    await loadMaster();
  } catch (e) { $("msg").textContent = "Չհաջողվեց բեռնել տվյալները։"; $("all").innerHTML = '<div class="empty">Չհաջողվեց բեռնել տվյալները։</div>'; }
}
window.pick = async (mid, sid) => { $("master").value = mid; await loadMaster(sid); $("book").scrollIntoView({ behavior: "smooth", block: "start" }); };

async function loadMaster(sid) {
  const m = masters.find(x => x.id === $("master").value);
  const t = await getDocs(query(collection(db, "users", m.id, "slots"), where("booked", "==", false)));
  const today = todayStr();
  slots = t.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.date >= today)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  $("serv").innerHTML = m.services.map(x => `<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join("");
  if (sid) $("serv").value = sid;
  $("slot").innerHTML = slots.map(x => `<option value="${x.id}">${fmtDate(x.date)} ${x.time}</option>`).join("");
  $("bForm").classList.remove("hide");
  $("msg").classList.toggle("hide", slots.length > 0);
  $("msg").textContent = slots.length ? "" : "Այս աշխատակցի մոտ այս պահին ազատ ժամեր չկան։ Ընտրեք մեկ այլ աշխատակցի։";
  $("btn").disabled = !slots.length;
}
$("master").onchange = () => loadMaster();

$("bForm").onsubmit = async e => {
  e.preventDefault();
  const m = masters.find(x => x.id === $("master").value);
  const sv = m.services.find(x => x.id === $("serv").value), sl = slots.find(x => x.id === $("slot").value);
  $("btn").disabled = true; $("err").textContent = "";
  try {
    const b = writeBatch(db);
    b.set(doc(collection(db, "users", m.id, "clients")), {
      name: $("name").value.trim(), phone: $("phone").value.trim(),
      serviceId: sv.id, serviceName: sv.name, price: sv.price,
      slotId: sl.id, date: sl.date, time: sl.time, createdAt: serverTimestamp() });
    b.update(doc(db, "users", m.id, "slots", sl.id), { booked: true });
    await b.commit(); // եթե ժամը մինչ այդ զբաղեցվել է, գործողությունը կմերժվի
    $("bForm").classList.add("hide"); $("done").classList.remove("hide");
  } catch (er) {
    $("err").textContent = "Այս ժամն արդեն զբաղված է կամ տեղի ունեցավ սխալ։ Ընտրեք այլ ժամ։";
    loadMaster().catch(() => {});
  } finally { $("btn").disabled = false; }
};
init();
</script>
</body>
</html>
